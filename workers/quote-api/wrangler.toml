name = "stock-quote-api"
main = "src/index.ts"
compatibility_date = "2026-09-04"

[vars]
# 실계좌 연동 환경. 주문 기능은 별도 단계에서 안전장치를 확인한 뒤 활성화한다.
KIS_ENVIRONMENT = "LIVE"
ALLOWED_ORIGIN = "https://poormanz.github.io"

# 배포/실행 시 전체 10자리 계좌번호를 서버 비밀변수로 관리하고,
# Worker 내부에서 앞 8자리(CANO)와 뒤 2자리(계좌상품코드)로 분리한다.
[secrets]
required = ["APP_KEY", "APP_SECRET", "ACCOUNT_NUM"]
