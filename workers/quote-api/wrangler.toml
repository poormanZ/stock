name = "stock-quote-api"
main = "src/worker.ts"
compatibility_date = "2026-09-04"

[vars]
KIS_ENVIRONMENT = "LIVE"
ALLOWED_ORIGIN = "https://poormanz.github.io"
# LIVE_TRADING_ENABLED / PAPER_VERIFICATION_DATE 는 의도적으로 두지 않는다. 실계좌 주문 게이트는 기본 비활성이다.

# KST 09:00~15:59 평일, 5분 간격. 엔진이 RUNNING 상태일 때만 동작한다.
[triggers]
crons = ["*/5 0-6 * * 1-5"]

[secrets]
required = ["APP_KEY", "APP_SECRET", "ACCOUNT_CANO", "ACCOUNT_PRODUCT_CODE"]

[[kv_namespaces]]
binding = "KIS_TOKEN_CACHE"

[[durable_objects.bindings]]
name = "KIS_TOKEN_BROKER"
class_name = "KISTokenBroker"

[[durable_objects.bindings]]
name = "INTERNAL_STATE_STORE"
class_name = "InternalStateStoreDO"

[[durable_objects.bindings]]
name = "DRY_RUN_STATE_STORE"
class_name = "DryRunStateStoreDO"

[[durable_objects.bindings]]
name = "RISK_STATE_STORE"
class_name = "RiskStateStoreDO"

[[durable_objects.bindings]]
name = "AUDIT_LOG_STORE"
class_name = "AuditLogStoreDO"

[[durable_objects.bindings]]
name = "TRADING_STATE_STORE"
class_name = "TradingStateStoreDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["KISTokenBroker"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["InternalStateStoreDO"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["DryRunStateStoreDO"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["RiskStateStoreDO"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["AuditLogStoreDO", "TradingStateStoreDO"]
