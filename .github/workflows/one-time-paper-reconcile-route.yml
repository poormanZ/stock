name: One-time PAPER reconciliation route wiring

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-paper-reconcile-route.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire route and clean up
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          index = Path('workers/quote-api/src/index.ts')
          text = index.read_text()

          import_anchor = "import { reconcile } from './reconciliation';\n"
          import_line = "import { resyncPaperOrders } from './paper-order-reconciliation';\n"
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          route_anchor = "    if (request.method !== 'GET') return json({ error: 'METHOD_NOT_ALLOWED' }, 405, origin);\n"
          route = '''    if (url.pathname === '/paper/reconcile' && request.method === 'POST') {
      if (getEnvironment(env) !== 'PAPER') return json({ error: 'PAPER_ENVIRONMENT_REQUIRED' }, 409, origin);
      if (!env.ACCOUNT_CANO || !env.ACCOUNT_PRODUCT_CODE) return json({ error: 'ACCOUNT_NOT_CONFIGURED' }, 503, origin);

      try {
        const internalId = env.INTERNAL_STATE_STORE.idFromName('primary');
        const internalStore = env.INTERNAL_STATE_STORE.get(internalId);
        const internalResponse = await internalStore.fetch('https://internal-state/');
        if (!internalResponse.ok) throw new Error('INTERNAL_STATE_UNAVAILABLE');
        const internalState = (await internalResponse.json()) as {
          positions: { symbol: string; quantity: number }[];
          orders: { brokerOrderId: string; status: string; symbol: string; side: 'buy' | 'sell' | 'unknown'; quantity: number; executedQuantity: number }[];
          orderRecords?: Order[];
        };

        const [account, brokerHistory] = await Promise.all([
          new KISAccountAdapter(createClient(env), getEnvironment(env), env.ACCOUNT_CANO, env.ACCOUNT_PRODUCT_CODE).getSnapshot(),
          new KISOrderAdapter(createClient(env), getEnvironment(env), env.ACCOUNT_CANO, env.ACCOUNT_PRODUCT_CODE).getOrderHistory(getKstDate(), getKstDate()),
        ]);

        const internalOrders = internalState.orderRecords ?? [];
        const result = resyncPaperOrders(internalOrders, brokerHistory.orders);
        const changedOrders = result.orders.filter((order, index) => order.updatedAt !== internalOrders[index]?.updatedAt);
        for (const order of changedOrders) {
          await internalStore.fetch(new Request('https://internal-state/', {
            method: 'POST',
            body: JSON.stringify({ action: 'apply-order', order }),
            headers: { 'content-type': 'application/json' },
          }));
        }

        return json({
          asOf: new Date().toISOString(),
          environment: getEnvironment(env),
          account,
          updated: result.updated,
          unresolved: result.unresolved,
          orders: result.orders,
        }, 200, origin);
      } catch (error) {
        return errorResponse(error, origin, 'RECONCILIATION');
      }
    }

'''
          if route not in text:
              if route_anchor not in text:
                  raise SystemExit('route anchor not found')
              text = text.replace(route_anchor, route + route_anchor, 1)

          index.write_text(text)

          roadmap = Path('docs/roadmap.md')
          roadmap_text = roadmap.read_text()
          roadmap_text = roadmap_text.replace('- [ ] 주문 상태 재동기화', '- [x] 주문 상태 재동기화')
          roadmap_text = roadmap_text.replace('- [ ] 주문/체결 조회', '- [x] 주문/체결 조회')
          roadmap_text = roadmap_text.replace('- [ ] 부분체결/취소 복구', '- [x] 부분체결/취소 복구')
          roadmap_text = roadmap_text.replace('**Phase 7 — 주문/체결 조회 및 PAPER 상태 재동기화**.', '**Phase 7 — 주문/체결 조회 및 PAPER 상태 재동기화** (완료).')
          roadmap.write_text(roadmap_text)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-paper-reconcile-route.yml
          git add workers/quote-api/src/index.ts docs/roadmap.md
          git commit -m 'feat: add PAPER order reconciliation endpoint'
          git push origin main
