name: PAPER Stability Validation

on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * 1-5'

permissions:
  contents: read

concurrency:
  group: paper-stability
  cancel-in-progress: false

jobs:
  stability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/quote-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/quote-api/package.json

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Run PAPER stability suite
        run: npm test -- --reporter=dot
